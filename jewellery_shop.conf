# ============================================================
# Nginx Reverse Proxy Configuration
# Jewellery Shop — Backend Server Level
# Save as: /etc/nginx/sites-available/jewellery_shop
# Enable: ln -s /etc/nginx/sites-available/jewellery_shop /etc/nginx/sites-enabled/
# ============================================================

# ── Rate limiting zones ─────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── Upstream — Gunicorn workers ─────────────────────────────
upstream flask_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── TLS (Let's Encrypt via Certbot) ───────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection         "1; mode=block"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"       always;

    # ── Logging ────────────────────────────────────────────
    access_log /var/log/nginx/jewellery_access.log;
    error_log  /var/log/nginx/jewellery_error.log  warn;

    # ── Static frontend ────────────────────────────────────
    root /var/www/jewellery_shop/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy → Flask/Gunicorn ─────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # CORS is handled in Flask; nginx just forwards
    }

    # Stricter rate limit on auth endpoints
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Block common attack vectors ────────────────────────
    location ~ /\.env        { deny all; return 404; }
    location ~ /\.git        { deny all; return 404; }
    location ~ /\.(htaccess) { deny all; return 404; }

    # ── Health check (no rate limit) ───────────────────────
    location = /api/health {
        proxy_pass http://flask_app;
        access_log off;
    }

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
